<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="CicalengkaGO Super App - Multi-vendor food, grocery, delivery & driver service">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cicalengkago_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>CicalengkaGO - Super App</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
</head>
<body>
  <script>
    // Cache buster for Flutter Web to prevent stale Cloudflare / Service Worker cache
    (function() {
      var buildTime = new Date().getTime();
      var originalFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === 'string' && url.indexOf('main.dart.js') !== -1) {
          url = url + (url.indexOf('?') === -1 ? '?' : '&') + 'v=' + buildTime;
        }
        return originalFetch.call(this, url, options);
      };

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].update();
          }
        });
      }

      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + buildTime;
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
