server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression untuk performa cepat di Web/Mobile
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/x-javascript 
        application/javascript 
        application/xml 
        application/json 
        application/wasm 
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Routing SPA (Single Page Application) Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan cache file aplikasi Flutter utama (agar update langsung aktif tanpa tersangkut cache)
    location ~* (index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Cache untuk aset statis (gambar, font, wasm, audio)
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm|mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
