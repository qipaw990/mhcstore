<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Dark Glossy Gradient Background -->
    <linearGradient id="cgoDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- White Rim Highlight -->
    <linearGradient id="cgoWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Heavy Drop Shadow Filter -->
    <filter id="cgoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Dark Badge Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#cgoDarkBg)" stroke="#333333" stroke-width="2" filter="url(#cgoShadow)" />

  <!-- Speed Arc Accent Lines -->
  <path d="M 92 28 L 104 22" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="108" cy="38" r="2.5" fill="#FFFFFF" />

  <!-- Bold Monogram 'C' Loop -->
  <path d="M 76 34 A 30 30 0 1 0 76 86" fill="none" stroke="url(#cgoWhiteGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Directional Arrow Top Right of 'C' -->
  <polygon points="76,23 96,34 76,45" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Center Core Location Dot -->
  <circle cx="60" cy="60" r="10" fill="url(#cgoWhiteGrad)" stroke="#111111" stroke-width="2" />
</svg>
