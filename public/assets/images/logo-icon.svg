<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Red Theme Background Gradient -->
    <linearGradient id="cgoRedBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3848" />
      <stop offset="100%" stop-color="#C61524" />
    </linearGradient>
    
    <!-- Inner Ring Shadow / Highlight -->
    <linearGradient id="cgoRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Core Dot Gradient -->
    <linearGradient id="cgoDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cgoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7F1D1D" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base in Vibrant Red -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#cgoRedBgGrad)" filter="url(#cgoShadow)" />

  <!-- Speed Arc Accent Lines (Subtle Mobility) -->
  <path d="M 28 60 A 32 32 0 0 1 82 32" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Outer C-Swoosh Ring (Dynamic Monogram 'C' + Forward Loop) -->
  <path d="M 76 34 A 32 32 0 1 0 76 86" fill="none" stroke="url(#cgoRingGrad)" stroke-width="13" stroke-linecap="round" />

  <!-- Forward GO Speed Arrow on the top wing of 'C' -->
  <polygon points="78,25 96,34 78,43" fill="#FFFFFF" />

  <!-- Center Core Location / Radar Dot -->
  <circle cx="60" cy="60" r="11" fill="url(#cgoDotGrad)" />
</svg>
