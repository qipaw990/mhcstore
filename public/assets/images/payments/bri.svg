<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" fill="none">
    <rect width="160" height="50" rx="8" fill="#FFFFFF"/>
    <!-- BRI Blue Rounded Badge -->
    <rect x="18" y="10" width="46" height="30" rx="6" fill="#00529C"/>
    <!-- Orange accent bar inside or bottom -->
    <path d="M22 36 H60" stroke="#FF6A00" stroke-width="2.5" stroke-linecap="round"/>
    <!-- BRI Text in badge -->
    <text x="41" y="29" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BRI</text>
    <!-- Bank BRI text -->
    <text x="72" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#00529C" letter-spacing="-0.3">BANK BRI</text>
    <text x="72" y="37" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="600" fill="#666" letter-spacing="0.2">Melayani Setulus Hati</text>
</svg>
