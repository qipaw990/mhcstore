<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="100%" height="100%">
  <defs>
    <!-- Dark Glossy Gradient Background -->
    <linearGradient id="cgoDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- White Rim Highlight -->
    <linearGradient id="cgoWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="markShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 15)">
    <!-- Dark Squircle Badge -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#cgoDarkBg)" stroke="#333333" stroke-width="2" filter="url(#markShadow)" />
    <!-- C-Swoosh -->
    <path d="M 52 24 A 20 20 0 1 0 52 56" fill="none" stroke="url(#cgoWhiteGrad)" stroke-width="10" stroke-linecap="round" />
    <!-- Arrow -->
    <polygon points="52,16 66,24 52,32" fill="#FFFFFF" stroke="#111111" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Core Dot -->
    <circle cx="40" cy="40" r="7.5" fill="url(#cgoWhiteGrad)" stroke="#111111" stroke-width="1.5" />
    <!-- Speed Lines Top Right -->
    <path d="M 68 12 L 78 8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="82" cy="18" r="2" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(104, 58)">
    <!-- Text: Cicalengka (Dynamic Script look) -->
    <text x="0" y="0" font-family="'Brush Script MT', 'Segoe Script', 'Inter', cursive, sans-serif" font-style="italic" font-size="40" font-weight="900" fill="#111827" letter-spacing="-0.5">Cicalengka</text>
    
    <!-- Badge GO -->
    <g transform="translate(186, -34)">
      <rect x="0" y="6" width="68" height="38" rx="14" fill="#111827" stroke="#333333" stroke-width="1.5" filter="url(#markShadow)" />
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1">GO</text>
      <!-- Play button icon inside O -->
      <polygon points="50,22 56,26 50,30" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Tagline bar: CICALENGKA -->
  <g transform="translate(108, 76)">
    <rect x="0" y="0" width="160" height="20" rx="10" fill="#111827" />
    <circle cx="10" cy="10" r="6" fill="#333333" />
    <circle cx="10" cy="10" r="2.5" fill="#FFFFFF" />
    <text x="24" y="14" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">CICALENGKA</text>
  </g>
</svg>
