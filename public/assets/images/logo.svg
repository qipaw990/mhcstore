<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cgoRedMarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3848" />
      <stop offset="100%" stop-color="#C61524" />
    </linearGradient>
    <filter id="markShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7F1D1D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Squircle -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#cgoRedMarkBg)" filter="url(#markShadow)" />
    <!-- C-Swoosh -->
    <path d="M 52 24 A 22 22 0 1 0 52 56" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <!-- Arrow -->
    <polygon points="53,17 67,24 53,31" fill="#FFFFFF" />
    <!-- Core Dot -->
    <circle cx="40" cy="40" r="7.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(106, 52)">
    <!-- Text: Cicalengka -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#111827" letter-spacing="-1.2">Cicalengka</text>
    <!-- Text: GO (Red) -->
    <text x="186" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#EE2737" letter-spacing="-0.5">GO</text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(108, 73)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.5">SUPER APP CICALENGKA</text>
  </g>

  <!-- Speed dot accent -->
  <circle cx="348" cy="45" r="4.5" fill="#EE2737" />
</svg>
