<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koneksi Terputus - CicalengkaGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 380px;
            width: 100%;
        }
        .offline-icon {
            width: 90px;
            height: 90px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        .btn-retry {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-retry:hover {
            background: #1d4ed8;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h4 class="fw-bold mb-2">Anda Sedang Offline</h4>
        <p class="text-muted small mb-4">
            Koneksi internet Anda terputus. Silakan periksa jaringan data atau WiFi Anda untuk kembali memesan di CicalengkaGO.
        </p>
        <button onclick="window.location.reload()" class="btn btn-retry mb-2">
            <i class="bi bi-arrow-clockwise me-1"></i> Coba Hubungkan Kembali
        </button>
    </div>
</body>
</html>
