version: '3.8'

services:
  cicalengkago_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicalengkago_app
    restart: always
    ports:
      - "8090:80"
    environment:
      - APP_ENV=production
      - APP_URL=https://cicago.store
      - PUBLIC_URL=https://cicago.store
      - DB_HOST=cicalengkago_db
      - DB_PORT=3306
      - DB_DATABASE=cicalengkago
      - DB_USERNAME=cicalengka_user
      - DB_PASSWORD=cicalengka_pass
      - DB_NAME=cicalengkago
      - DB_USER=cicalengka_user
      - DB_PASS=cicalengka_pass
    depends_on:
      - cicalengkago_db
    volumes:
      - .:/var/www/html

  cicalengkago_db:
    image: mariadb:10.11
    container_name: cicalengkago_db
    restart: always
    environment:
      MARIADB_DATABASE: cicalengkago
      MARIADB_USER: cicalengka_user
      MARIADB_PASSWORD: cicalengka_pass
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - cicalengkago_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeders.sql:/docker-entrypoint-initdb.d/02_seeders.sql:ro

  cicago_wa_gateway:
    build:
      context: ./whatsapp-gateway
      dockerfile: Dockerfile
    container_name: cicago_wa_gateway
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - WA_GATEWAY_SECRET=cicago_wa_secret_2024
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - cicago_wa_auth_data:/app/.wwebjs_auth

volumes:
  cicalengkago_db_data:
  cicago_wa_auth_data:
